name: Packages CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/SmartAbp.Vue/packages/**'
      - 'src/SmartAbp.Vue/scripts/**'
      - '.github/workflows/packages-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/SmartAbp.Vue/packages/**'

jobs:
  # 代码质量检查
  quality-check:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: TypeScript类型检查
        working-directory: src/SmartAbp.Vue
        run: npm run type-check
      
      - name: ESLint检查
        working-directory: src/SmartAbp.Vue
        run: npm run lint
  
  # packages独立构建
  build-packages:
    name: 构建Packages
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: 构建所有packages
        working-directory: src/SmartAbp.Vue
        run: npm run packages:build
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: src/SmartAbp.Vue/packages/*/dist
          retention-days: 7
  
  # 单元测试
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: 运行测试
        working-directory: src/SmartAbp.Vue
        run: npm run packages:test:coverage
      
      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          files: src/SmartAbp.Vue/coverage/lcov.info
          flags: packages
          fail_ci_if_error: false
  
  # 性能测试
  performance:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: build-packages
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: src/SmartAbp.Vue/packages
      
      - name: 性能测试
        working-directory: src/SmartAbp.Vue
        run: npm run packages:perf
  
  # 发布到npm (仅在main分支且有version tag时)
  publish:
    name: 发布到npm
    runs-on: ubuntu-latest
    needs: [build-packages, test]
    if: github.ref == 'refs/heads/main' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: src/SmartAbp.Vue/packages
      
      - name: 发布到npm
        working-directory: src/SmartAbp.Vue
        run: npm run packages:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  
  # Storybook构建和部署
  storybook:
    name: 构建Storybook
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4
      
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SmartAbp.Vue/package-lock.json
      
      - name: 安装依赖
        working-directory: src/SmartAbp.Vue
        run: npm ci
      
      - name: 构建Storybook
        working-directory: src/SmartAbp.Vue
        run: npm run storybook:build
      
      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: src/SmartAbp.Vue/storybook-static
          destination_dir: storybook
