{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartabp.fullname" . }}-backend
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "smartabp.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "smartabp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend/secret.yaml") . | sha256sum }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "smartabp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        version: {{ .Values.backend.image.tag | quote }}
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smartabp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      # Init container for database migration
      initContainers:
        - name: db-migration
          image: "{{ .Values.backend.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/bin/sh"]
          args:
            - -c
            - |
              echo "Waiting for database to be ready..."
              until nc -z {{ include "smartabp.postgresql.host" . }} {{ include "smartabp.postgresql.port" . }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "Database is ready, running migrations..."
              dotnet SmartAbp.DbMigrator.dll
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ include "smartabp.fullname" . }}-backend-secret
                  key: database-connection-string
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.backend.env.ASPNETCORE_ENVIRONMENT | quote }}
            - name: ASPNETCORE_URLS
              value: {{ .Values.backend.env.ASPNETCORE_URLS | quote }}
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ include "smartabp.fullname" . }}-backend-secret
                  key: database-connection-string
            - name: ConnectionStrings__Redis
              value: {{ .Values.backend.env.ConnectionStrings__Redis | quote }}
            - name: App__CorsOrigins
              value: {{ .Values.backend.env.App__CorsOrigins | quote }}
            # Kubernetes metadata
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Application settings
            - name: App__SelfUrl
              value: "https://{{ (index .Values.backend.ingress.hosts 0).host }}"
            - name: App__ClientUrl
              value: "https://{{ (index .Values.frontend.ingress.hosts 0).host }}"
            - name: App__RedirectAllowedUrls
              value: "https://{{ (index .Values.frontend.ingress.hosts 0).host }}"
            # Monitoring and observability
            - name: OTEL_SERVICE_NAME
              value: "smartabp-backend"
            - name: OTEL_SERVICE_VERSION
              value: {{ .Values.backend.image.tag | default .Chart.AppVersion | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=smartabp-backend,service.version={{ .Values.backend.image.tag | default .Chart.AppVersion }},deployment.environment=production"
          envFrom:
            - configMapRef:
                name: {{ include "smartabp.fullname" . }}-backend-config
          {{- if .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          {{- end }}
          # Startup probe for slower startup times
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12  # 2 minutes total
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/Logs
      volumes:
        - name: app-config
          configMap:
            name: {{ include "smartabp.fullname" . }}-backend-appsettings
        - name: tmp
          emptyDir: {}
        - name: app-logs
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Graceful shutdown
      terminationGracePeriodSeconds: 60
      # DNS configuration for better performance
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: edns0
{{- end }}
