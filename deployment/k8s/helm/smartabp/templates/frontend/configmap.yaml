{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smartabp.fullname" . }}-frontend-config
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "smartabp.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  # Nginx configuration for Vue.js SPA
  default.conf: |
    # Vue.js SPA optimized Nginx configuration
    upstream backend_api {
        server {{ include "smartabp.fullname" . }}-backend:{{ .Values.backend.service.port }};
        keepalive 32;
    }
    
    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Enable brotli compression (if module is available)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/xml image/svg+xml
        application/x-font-ttf
        image/vnd.microsoft.icon
        application/x-font-opentype
        application/json font/eot
        application/vnd.ms-fontobject
        application/javascript font/otf
        application/xml application/xhtml+xml
        text/javascript  application/x-javascript
        text/plain application/x-font-truetype
        application/xml+rss image/x-icon
        font/opentype text/css image/x-win-bitmap;
    
    server {
        listen {{ .Values.frontend.service.targetPort }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://{{ (index .Values.backend.ingress.hosts 0).host }};" always;
        
        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        
        # API proxy to backend
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 16 16k;
            proxy_busy_buffers_size 32k;
            
            # File upload size
            client_max_body_size 100M;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Vue.js SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache control for HTML files
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
        }
        
        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # Server status page (for monitoring)
    server {
        listen 9090;
        server_name _;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
  
  # Environment configuration for Vue.js app
  env.js: |
    window.__SMARTABP_CONFIG__ = {
      API_BASE_URL: '{{ .Values.frontend.env.VITE_API_BASE_URL }}',
      BUILD_TARGET: '{{ .Values.frontend.env.VITE_BUILD_TARGET }}',
      VERSION: '{{ .Values.frontend.image.tag | default .Chart.AppVersion }}',
      ENVIRONMENT: '{{ .Values.frontend.env.NODE_ENV }}',
      FEATURES: {
        LOW_CODE_ENGINE: true,
        VISUAL_DESIGNER: true,
        CODE_GENERATION: true,
        TEMPLATE_MANAGEMENT: true
      },
      MONITORING: {
        ENABLED: {{ .Values.monitoring.enabled }},
        {{- if .Values.monitoring.enabled }}
        SENTRY_DSN: '{{ .Values.monitoring.sentry.dsn | default "" }}',
        {{- end }}
      },
      BRANDING: {
        APP_NAME: 'SmartAbp LowCode Engine',
        COMPANY_NAME: 'SmartAbp',
        VERSION: '{{ .Chart.AppVersion }}'
      }
    };
{{- end }}
