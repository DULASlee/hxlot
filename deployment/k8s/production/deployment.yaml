apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartabp-app
  namespace: smartabp-production
  labels:
    app: smartabp
    component: app
    version: v1.0.0
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smartabp
      component: app
  template:
    metadata:
      labels:
        app: smartabp
        component: app
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: smartabp-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - smartabp
                topologyKey: kubernetes.io/hostname
      
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo waiting for db; sleep 2; done;']
        
        - name: wait-for-redis
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z redis-service 6379; do echo waiting for redis; sleep 2; done;']
      
      containers:
        - name: smartabp
          image: smartabp/lowcode-generator:1.0.0
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            
            # 数据库配置
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: smartabp-secrets
                  key: database-connection-string
            
            # Redis配置
            - name: Redis__Configuration
              valueFrom:
                secretKeyRef:
                  name: smartabp-secrets
                  key: redis-connection-string
            
            # JWT配置
            - name: Authentication__JwtBearer__SecurityKey
              valueFrom:
                secretKeyRef:
                  name: smartabp-secrets
                  key: jwt-secret-key
            
            # 应用配置
            - name: App__SelfUrl
              valueFrom:
                configMapKeyRef:
                  name: smartabp-config
                  key: app-self-url
            - name: App__CorsOrigins
              valueFrom:
                configMapKeyRef:
                  name: smartabp-config
                  key: app-cors-origins
          
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: temp
              mountPath: /app/temp
            - name: generated
              mountPath: /app/generated
          
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      
      volumes:
        - name: config
          configMap:
            name: smartabp-config
            items:
              - key: production.json
                path: production.json
        - name: logs
          emptyDir: {}
        - name: temp
          emptyDir: {}
        - name: generated
          persistentVolumeClaim:
            claimName: smartabp-generated-pvc
      
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: smartabp-app
  namespace: smartabp-production
  labels:
    app: smartabp
    component: app
spec:
  type: ClusterIP
  selector:
    app: smartabp
    component: app
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartabp-app-hpa
  namespace: smartabp-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartabp-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
