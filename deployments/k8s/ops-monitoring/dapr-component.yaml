# Dapr State Store组件（用于缓存）
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: smartabp
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master:6379
  - name: redisPassword
    secretKeyRef:
      name: smartabp-secrets
      key: redis-password
  - name: enableTLS
    value: "false"
  - name: maxRetries
    value: "3"
  - name: maxRetryBackoff
    value: "2000"

---
# Dapr Pub/Sub组件（用于事件发布）
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: smartabp
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis-master:6379
  - name: redisPassword
    secretKeyRef:
      name: smartabp-secrets
      key: redis-password
  - name: enableTLS
    value: "false"
  - name: consumerID
    value: smartabp-ops-monitoring

---
# Dapr Bindings组件（用于定时任务）
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: cron-binding
  namespace: smartabp
spec:
  type: bindings.cron
  version: v1
  metadata:
  - name: schedule
    value: "@every 5m" # 每5分钟执行一次
  - name: direction
    value: "input"

---
# Dapr Configuration（用于全局配置）
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: smartabp-dapr-config
  namespace: smartabp
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin:9411/api/v2/spans"
  metric:
    enabled: true
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  accessControl:
    defaultAction: allow
    trustDomain: "public"
  nameResolution:
    component: "kubernetes"
    configuration:
      clusterDomain: "cluster.local"

