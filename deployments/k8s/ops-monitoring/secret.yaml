apiVersion: v1
kind: Secret
metadata:
  name: smartabp-secrets
  namespace: smartabp
  labels:
    app: smartabp
type: Opaque
stringData:
  # 数据库连接字符串（生产环境请使用加密存储）
  ops-db-connection: "Host=postgresql-primary:5432;Database=SmartAbp_OpsManagement;Username=smartabp;Password=REPLACE_WITH_SECURE_PASSWORD"
  
  # JWT密钥
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET_KEY_AT_LEAST_32_CHARACTERS"
  
  # Elasticsearch认证（如需要）
  elasticsearch-username: "elastic"
  elasticsearch-password: "REPLACE_WITH_ELASTICSEARCH_PASSWORD"
  
  # Prometheus认证（如需要）
  prometheus-username: "admin"
  prometheus-password: "REPLACE_WITH_PROMETHEUS_PASSWORD"
  
  # SMTP配置（用于告警通知）
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-username: "notifications@smartabp.com"
  smtp-password: "REPLACE_WITH_SMTP_PASSWORD"
  
  # 钉钉Webhook（用于告警通知）
  dingtalk-webhook: "https://oapi.dingtalk.com/robot/send?access_token=REPLACE_WITH_TOKEN"
  
  # 微信Webhook（用于告警通知）
  wechat-webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=REPLACE_WITH_KEY"

