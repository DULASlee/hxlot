apiVersion: v1
kind: Service
metadata:
  name: smartabp-ops-monitoring
  namespace: smartabp
  labels:
    app: smartabp-ops-monitoring
    tier: platform
  annotations:
    # Prometheus监控
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: smartabp-ops-monitoring
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
apiVersion: v1
kind: Service
metadata:
  name: smartabp-ops-monitoring-headless
  namespace: smartabp
  labels:
    app: smartabp-ops-monitoring
    tier: platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: smartabp-ops-monitoring
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  publishNotReadyAddresses: true

---
apiVersion: v1
kind: Service
metadata:
  name: smartabp-ops-monitoring-lb
  namespace: smartabp
  labels:
    app: smartabp-ops-monitoring
    tier: platform
  annotations:
    # 云厂商LoadBalancer配置（根据实际情况调整）
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-spec: "slb.s2.small"
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-protocol-port: "http:80,https:443"
spec:
  type: LoadBalancer
  selector:
    app: smartabp-ops-monitoring
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: https
    protocol: TCP
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP

