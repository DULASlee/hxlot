# SmartAbp Enterprise LowCode Engine - Development Docker Compose
version: '3.8'

services:
  # 开发数据库
  sqlserver-dev:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartabp-sqlserver-dev
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=DevPassword123!
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-dev-data:/var/opt/mssql
    networks:
      - smartabp-dev-network

  # 开发Redis
  redis-dev:
    image: redis:7-alpine
    container_name: smartabp-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass DevRedis123!
    ports:
      - "6380:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - smartabp-dev-network

  # 开发Elasticsearch
  elasticsearch-dev:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: smartabp-elasticsearch-dev
    restart: unless-stopped
    environment:
      - node.name=smartabp-dev-es01
      - cluster.name=smartabp-dev-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-dev-data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks:
      - smartabp-dev-network

  # pgAdmin (数据库管理工具)
  pgadmin-dev:
    image: dpage/pgadmin4:latest
    container_name: smartabp-pgadmin-dev
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@smartabp.com
      - PGADMIN_DEFAULT_PASSWORD=DevAdmin123!
    ports:
      - "8082:80"
    volumes:
      - pgadmin-dev-data:/var/lib/pgadmin
    networks:
      - smartabp-dev-network

  # Redis Commander (Redis管理工具)
  redis-commander-dev:
    image: rediscommander/redis-commander:latest
    container_name: smartabp-redis-commander-dev
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=dev:redis-dev:6379:1:DevRedis123!
    ports:
      - "8083:8081"
    depends_on:
      - redis-dev
    networks:
      - smartabp-dev-network

  # Mailhog (邮件测试工具)
  mailhog-dev:
    image: mailhog/mailhog:latest
    container_name: smartabp-mailhog-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - smartabp-dev-network

  # MinIO (对象存储开发环境)
  minio-dev:
    image: minio/minio:latest
    container_name: smartabp-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=smartabp
      - MINIO_ROOT_PASSWORD=DevStorage123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-dev-data:/data
    networks:
      - smartabp-dev-network

  # 开发环境监控
  prometheus-dev:
    image: prom/prometheus:latest
    container_name: smartabp-prometheus-dev
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9091:9090"
    volumes:
      - ./scripts/performance-testing/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-dev-data:/prometheus
    networks:
      - smartabp-dev-network

  # 开发环境Grafana
  grafana-dev:
    image: grafana/grafana:latest
    container_name: smartabp-grafana-dev
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=dev123
      - GF_USERS_ALLOW_SIGN_UP=true
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ./scripts/performance-testing/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus-dev
    networks:
      - smartabp-dev-network

  # Jaeger 链路追踪
  jaeger-dev:
    image: jaegertracing/all-in-one:latest
    container_name: smartabp-jaeger-dev
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
      - "14250:14250"  # Jaeger gRPC
    networks:
      - smartabp-dev-network

# 开发网络配置
networks:
  smartabp-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# 开发数据卷配置
volumes:
  sqlserver-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  elasticsearch-dev-data:
    driver: local
  pgadmin-dev-data:
    driver: local
  minio-dev-data:
    driver: local
  prometheus-dev-data:
    driver: local
  grafana-dev-data:
    driver: local
