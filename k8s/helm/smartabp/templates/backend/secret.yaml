{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smartabp.fullname" . }}-backend-secret
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "smartabp.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
data:
  # Database connection string with password injection
  database-connection-string: {{ printf "Server=%s;Port=%v;Database=%s;User Id=%s;Password=%s;" (include "smartabp.postgresql.host" .) (include "smartabp.postgresql.port" .) (include "smartabp.postgresql.database" .) (include "smartabp.postgresql.username" .) .Values.postgresql.auth.password | b64enc }}
  
  # JWT signing key (generate a secure random key for production)
  jwt-signing-key: {{ "SmartAbp2024JwtSigningKeyChangeInProduction!" | b64enc }}
  
  # String encryption key
  string-encryption-key: {{ "SmartAbp2024DefaultPassPhrase" | b64enc }}
  
  # API keys for external services
  {{- if .Values.backend.externalServices }}
  {{- if .Values.backend.externalServices.openai }}
  openai-api-key: {{ .Values.backend.externalServices.openai.apiKey | b64enc }}
  {{- end }}
  {{- if .Values.backend.externalServices.azure }}
  azure-storage-connection-string: {{ .Values.backend.externalServices.azure.storageConnectionString | b64enc }}
  {{- end }}
  {{- if .Values.backend.externalServices.aws }}
  aws-access-key-id: {{ .Values.backend.externalServices.aws.accessKeyId | b64enc }}
  aws-secret-access-key: {{ .Values.backend.externalServices.aws.secretAccessKey | b64enc }}
  {{- end }}
  {{- end }}
  
  # SMTP settings for email notifications
  {{- if .Values.alerting.email.enabled }}
  smtp-username: {{ .Values.alerting.email.smtp.username | b64enc }}
  smtp-password: {{ .Values.alerting.email.smtp.password | b64enc }}
  {{- end }}
  
  # Application secrets
  admin-email: {{ "admin@smartabp.com" | b64enc }}
  admin-password: {{ "SmartAbp2024Admin!" | b64enc }}
  
  # Redis password (if authentication is enabled)
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | default "SmartAbpRedis2024!" | b64enc }}
  {{- end }}
{{- end }}
