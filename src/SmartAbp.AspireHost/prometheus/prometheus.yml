global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'smartabp-local'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # SmartAbp运维监控微服务
  - job_name: 'smartabp-ops-monitoring'
    static_configs:
    - targets: ['host.docker.internal:8080']
      labels:
        service: 'ops-monitoring'
        environment: 'development'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # SmartAbp主Web应用
  - job_name: 'smartabp-web'
    static_configs:
    - targets: ['host.docker.internal:5000']
      labels:
        service: 'web-app'
        environment: 'development'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # SmartAbp代码生成器
  - job_name: 'smartabp-codegen'
    static_configs:
    - targets: ['host.docker.internal:6000']
      labels:
        service: 'code-generator'
        environment: 'development'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus自监控
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']
      labels:
        service: 'prometheus'

  # Node Exporter（系统指标）
  - job_name: 'node-exporter'
    static_configs:
    - targets: ['host.docker.internal:9100']
      labels:
        service: 'node-exporter'

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
    - targets: ['host.docker.internal:9187']
      labels:
        service: 'postgres'

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
    - targets: ['host.docker.internal:9121']
      labels:
        service: 'redis'

  # Elasticsearch Exporter
  - job_name: 'elasticsearch-exporter'
    static_configs:
    - targets: ['host.docker.internal:9114']
      labels:
        service: 'elasticsearch'

